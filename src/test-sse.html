<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE 测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages { margin-top: 20px; padding: 10px; border: 1px solid #ccc; height: 300px; overflow-y: auto; }
        .message { margin-bottom: 10px; padding: 5px; border-bottom: 1px solid #eee; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>SSE 连接测试</h1>
    <div>
        <label for="messageInput">输入消息:</label>
        <input type="text" id="messageInput" placeholder="输入要发送的消息">
        <button onclick="sendMessage()">发送</button>
        <button onclick="closeConnection()">关闭连接</button>
    </div>
    <div id="messages"></div>
    <div id="status"></div>

    <script>
        let eventSource = null;
        let messagesDiv = document.getElementById('messages');
        let statusDiv = document.getElementById('status');
        let messageInput = document.getElementById('messageInput');

        function appendMessage(text, type = 'info') {
            const messageElement = document.createElement('div');
            messageElement.className = 'message ' + type;
            messageElement.textContent = text;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(text, type = 'info') {
            statusDiv.className = type;
            statusDiv.textContent = text;
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) {
                appendMessage('请输入消息', 'error');
                return;
            }

            // 关闭现有连接
            if (eventSource) {
                eventSource.close();
                appendMessage('关闭现有连接');
            }

            // 构建查询参数
            const params = new URLSearchParams();
            params.append('message', message);

            // 建立新连接
            try {
                appendMessage('正在建立SSE连接...');
                updateStatus('连接中...');

                // 使用与应用相同的URL
                const url = `/api/chat/stream?${params.toString()}`;
                eventSource = new EventSource(url, { withCredentials: true });

                // 处理消息
                eventSource.onmessage = function(event) {
                    appendMessage('收到消息: ' + event.data);
                    console.log('SSE消息:', event.data);
                };

                // 处理连接打开
                eventSource.onopen = function() {
                    appendMessage('SSE连接已打开', 'success');
                    updateStatus('已连接', 'success');
                };

                // 处理连接关闭
                eventSource.onclose = function() {
                    appendMessage('SSE连接已关闭');
                    updateStatus('已关闭');
                    eventSource = null;
                };

                // 处理错误
                eventSource.onerror = function(error) {
                    appendMessage('SSE连接错误: ' + (error.message || '未知错误'), 'error');
                    updateStatus('错误', 'error');
                    console.error('SSE错误:', error);

                    // 尝试重新连接
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                    }
                };

                // 清空输入框
                messageInput.value = '';
            } catch (error) {
                appendMessage('创建SSE连接失败: ' + error.message, 'error');
                updateStatus('连接失败', 'error');
                console.error('创建SSE连接失败:', error);
            }
        }

        function closeConnection() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                appendMessage('手动关闭SSE连接');
                updateStatus('已关闭');
            } else {
                appendMessage('没有活动的SSE连接', 'error');
            }
        }
    </script>
</body>
</html>
